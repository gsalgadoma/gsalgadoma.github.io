<script src="./presentacion-data.js"></script><script src="./descargar-pptx.js"></script><script>
const data=window.SOCHIMI_SLIDES;
document.getElementById("pptxdl").addEventListener("click",e=>window.descargarPPTXSOCHIMI(document.getElementById("pptx-status"),e.currentTarget));
let i=0;const root=document.getElementById("slide");
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function item(s,n){return '<div class="tag">'+esc(s[0])+'</div><h1>'+esc(s[1])+'</h1><div>'+s[2].split("|").map(t=>'<p>'+esc(t)+'</p>').join("")+'</div><div class="source">'+esc(s[3]||"SOCHIMI 2026 · UANDES")+'</div><span class="num">'+(n+1)+" / "+data.length+'</span>';}
function show(){root.innerHTML=item(data[i],i);document.getElementById("pos").textContent=(i+1)+" / "+data.length;document.getElementById("prev").disabled=i===0;document.getElementById("next").disabled=i===data.length-1;history.replaceState(null,"","#"+(i+1));}
document.getElementById("prev").onclick=()=>{i=Math.max(0,i-1);show()};document.getElementById("next").onclick=()=>{i=Math.min(data.length-1,i+1);show()};document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="PageDown"){i=Math.min(data.length-1,i+1);show()}if(e.key==="ArrowLeft"||e.key==="PageUp"){i=Math.max(0,i-1);show()}});const hash=Number(location.hash.replace("#",""));if(hash>=1&&hash<=data.length)i=hash-1;show();window.addEventListener("beforeprint",()=>{root.style.display="none";document.getElementById("all").innerHTML=data.map((s,n)=>'<section class="slide">'+item(s,n)+'</section>').join("")});window.addEventListener("afterprint",()=>{document.getElementById("all").innerHTML="";root.style.display="";show()});
</script><div id="all"></div></body></html>
