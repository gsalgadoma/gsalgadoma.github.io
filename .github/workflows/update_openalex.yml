name: Actualizar perfil OpenAlex

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: write

jobs:
  update-openalex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar OpenAlex
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/update_openalex.py

      - name: Publicar datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/openalex.json
          if git diff --cached --quiet; then
            echo "Los datos de OpenAlex no cambiaron."
          else
            git commit -m "Actualiza métricas OpenAlex"
            git push
          fi
