name: Compilar CV académico

on:
  push:
    paths:
      - 'files/Gabriel_Salgado_CV.tex'
      - '.github/workflows/build_cv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-lang-spanish

      - name: Compilar CV
        working-directory: files
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error Gabriel_Salgado_CV.tex
          pdflatex -interaction=nonstopmode -halt-on-error Gabriel_Salgado_CV.tex

      - name: Publicar PDF generado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/Gabriel_Salgado_CV.pdf
          if git diff --cached --quiet; then
            echo "El PDF ya está actualizado."
          else
            git commit -m "Actualiza CV PDF compilado"
            git push
          fi
